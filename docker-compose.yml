services:
  pocketbase:
    build:
      context: .
      dockerfile: Dockerfile.pb
      args:
        PB_VERSION: 0.18.3
        ARCH: linux_amd64
    container_name: pocketbase
    ports:
      - "8090:8090"
    volumes:
      - pocketbase_data:/pb/pb_data
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: app-builder
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - VITE_POCKETBASE_URL=http://localhost:8090
    volumes:
      - ./frontend:/app/frontend
      - /app/frontend/node_modules
    command: npm run dev
    depends_on:
      - pocketbase

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: app-builder
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - POCKETBASE_URL=http://localhost:8090
    volumes:
      - ./backend:/app/backend
      - /app/backend/node_modules
    command: npm run dev
    depends_on:
      - pocketbase

  # production bundle - do not expose duplicate host ports if running dev stack
  hrv-app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=production
      - POCKETBASE_URL=http://pocketbase:8090
    restart: unless-stopped
    # ports:  # intentionally commented: uncomment only when running standalone
    #   - "3001:3001"
    #   - "5000:5000"
    #   - "8090:8090"

volumes:
  pocketbase_data: 