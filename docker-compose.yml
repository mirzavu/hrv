version: "3.8"
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_PB_URL: https://pb.hrv.demotesting.co.uk
    restart: always
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
    env_file:
      - .env.production

  pocketbase:
    build:
      context: .
      dockerfile: Dockerfile.pocketbase
    restart: always
    ports:
      - "8091:8090"
    volumes:
      - ./pb_data:/pb/pb_data
      - ./pb_migrations:/pb/pb_migrations
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8090/api/health || exit 1" ]
      interval: 30s
      timeout: 30s
      start_period: 5s
      retries: 3
